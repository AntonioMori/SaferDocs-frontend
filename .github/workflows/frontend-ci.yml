name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  # Semanal: pega vulnerabilidade nova mesmo sem commit (segunda, 06:00 UTC).
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  # Na main nunca cancela a execução em andamento; só PRs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Typecheck, lint, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    env:
      # O build valida o env (RNF-08); estes valores só servem ao CI e não são segredos.
      VITE_API_BASE_URL: /api/v1
      VITE_SERVER_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock

      - name: Instalar dependências (lockfile congelado)
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      # REQ-66: falha o CI se houver vulnerabilidade de severidade alta ou crítica.
      # Falha fechado: o yarn 1 sai com um bitmask de severidades (e com erro de rede também),
      # então a decisão sai do JSON. Sem a linha `auditSummary` o audit não rodou de verdade
      # (registry fora do ar, resposta quebrada) e o job reprova em vez de passar em silêncio.
      - name: Auditoria de dependências (nível high)
        run: |
          yarn audit --json > audit.json || true
          if ! grep -q '"type":"auditSummary"' audit.json; then
            echo "O yarn audit não devolveu o resumo (auditSummary). Auditoria não concluída."
            exit 1
          fi
          blocking=$(node -e "
            const lines = require('fs').readFileSync('audit.json', 'utf8').split('\n').filter(Boolean);
            const summary = lines.map((l) => JSON.parse(l)).find((l) => l.type === 'auditSummary');
            const v = summary.data.vulnerabilities;
            console.log(v.high + v.critical);
          ")
          echo "Vulnerabilidades high ou critical: $blocking"
          if [ "$blocking" -ne 0 ]; then
            echo "Vulnerabilidade high ou critical encontrada."
            exit 1
          fi
